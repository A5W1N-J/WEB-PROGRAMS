<!DOCTYPE html>
<html>
<head>
    <title>Bulb ON/OFF</title>
</head>
<body>

    <h2>Turn ON/OFF Bulb</h2>

    <img id="bulb" src="/home/s1mcabatch1/Downloads/white_bulb.jpg">

    <br><br>

    <button onclick="turnOn()">ON</button>
    <button onclick="turnOff()">OFF</button>

    <script>
        function turnOn() {
            document.getElementById("bulb").src =
            "/home/s1mcabatch1/Downloads/yellow_bulb.jpg";
        }

        function turnOff() {
            document.getElementById("bulb").src =
            "/home/s1mcabatch1/Downloads/white_bulb.jpg";
        }
    </script>

</body>
</html>
