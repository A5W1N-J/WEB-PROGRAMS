<!DOCTYPE html>
<html>
<head>
<title>Striped Table</title>

    <style>
        #student {
            width: 70%;
            font-family: Arial, sans-serif;
            border-collapse: collapse;
        }

        #student th {
            padding: 10px;
            text-align: left;
            background-color: green;
            color: white;
            border: 1px solid black;
        }

        #student td {
            padding: 10px;
            border: 1px solid black;
        }

        #student tr:nth-child(even) {
            background-color: lightgray;
        }

        #student tr:hover {
            background-color: yellow;
        }
    </style>
</head>

<body>

<h1>Student Details</h1>

<table id="student">
    <tr>
        <th>Name</th>
        <th>Course</th>
        <th>Mark</th>
    </tr>

    <tr>
        <td>Aswin</td>
        <td>BCA</td>
        <td>85</td>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>BCA</td>
        <td>78</td>
    </tr>

    <tr>
        <td>Arun</td>
        <td>BCA</td>
        <td>90</td>
    </tr>

    <tr>
        <td>Vishnu</td>
        <td>BCA</td>
        <td>82</td>
    </tr>
</table>

</body>
</html>
